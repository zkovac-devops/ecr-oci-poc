name: publish-and-verify

# PoC of the ECR OCI design:
#   ghcr.io stands in for Artifactory, a Vault dev server stands in for the in-house Vault,
#   a kind cluster stands in for a Gardener shoot.
#
# This file plays the role of an application repository: it only CALLS the reusable workflow.
# In production the reusable workflow lives in a central repo and is referenced by tag.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_PREFIX: ${{ vars.ECR_PREFIX || 'poc' }}
  ECR_REG: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

jobs:
  # Caller must grant id-token: write – a reusable workflow cannot get more than its caller.
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      image-context: app
      chart-path: charts/poc-app

  # Negative test: a job that does NOT run the reusable workflow must not get the push role.
  trust-negative:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Show OIDC token claims
        run: |
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value \
            | python3 -c 'import sys,json,base64; p=sys.stdin.read().split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print(json.dumps({k:c.get(k) for k in ("sub","job_workflow_ref")}, indent=2))'

      - id: push_role
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-negative
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 1

      - name: Push role must be denied outside the reusable workflow
        env:
          OUTCOME: ${{ steps.push_role.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "::error::push role was assumed from a job outside the reusable workflow"; exit 1
          fi
          echo "OK: push role denied outside the reusable workflow"

  e2e:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.publish.outputs.tag }}
      CHART_VERSION: ${{ needs.publish.outputs.chart_version }}
      IMAGE_REPO: ${{ needs.publish.outputs.image_repo }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cosign-pub

      # Read-only role (stand-in for k8s-ecr-pull); the push role is not available here.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PULL_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-e2e
          aws-region: ${{ vars.AWS_REGION }}

      - uses: helm/kind-action@v1
        with:
          cluster_name: poc

      - uses: azure/setup-helm@v4
      - uses: fluxcd/flux2/action@main

      # In the real setup ESO refreshes this secret every 6h (design 5.2).
      - name: Namespaces + ECR pull secret
        run: |
          TOKEN=$(aws ecr get-login-password)
          for ns in poc flux-system; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n "$ns" create secret docker-registry ecr-pull \
              --docker-server="$ECR_REG" --docker-username=AWS --docker-password="$TOKEN"
          done
          kubectl label namespace poc policy.sigstore.dev/include=true
          kubectl -n poc patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ecr-pull"}]}'

      - name: Install Sigstore policy-controller + ClusterImagePolicy
        run: |
          helm repo add sigstore https://sigstore.github.io/helm-charts
          helm install policy-controller sigstore/policy-controller \
            -n cosign-system --create-namespace --wait --timeout 5m
          export COSIGN_PUBKEY_INDENTED="$(sed 's/^/          /' cosign.pub)"
          envsubst < k8s/clusterimagepolicy.yaml > cip.yaml && cat cip.yaml
          # helm --wait only waits for the pod; the webhook needs a moment to publish its certs
          for i in $(seq 1 24); do
            kubectl apply -f cip.yaml && break
            echo "webhook not ready yet, retrying in 5s ($i/24)"; sleep 5
          done
          kubectl get clusterimagepolicy ecr-poc-signed
          sleep 15   # let the webhook pick up the policy

      - name: "Admission: signed image from ECR is allowed"
        run: |
          kubectl -n poc run signed --image="$ECR_REG/$IMAGE_REPO:$IMAGE_TAG" --restart=Never
          kubectl -n poc wait pod/signed --for=condition=Ready --timeout=180s
          echo "OK: signed image admitted and pulled from ECR"

      - name: "Admission: unsigned image is rejected"
        run: |
          if kubectl -n poc run unsigned \
               --image="$ECR_REG/$ECR_PREFIX/apps/poc-unsigned:$IMAGE_TAG" --restart=Never 2> err.txt; then
            echo "::error::unsigned image was admitted"; exit 1
          fi
          cat err.txt
          echo "OK: unsigned image rejected"

      - name: "Flux: verified chart from ECR is deployed"
        run: |
          flux install --components=source-controller,helm-controller
          kubectl -n flux-system create secret generic cosign-pub --from-file=cosign.pub=cosign.pub
          envsubst < k8s/flux.yaml | tee /dev/stderr | kubectl apply -f -
          # helm-controller creates the HelmChart asynchronously – wait until it exists
          for i in $(seq 1 60); do
            kubectl -n flux-system get helmchart flux-system-poc-app >/dev/null 2>&1 && break
            sleep 5
          done
          kubectl -n flux-system wait helmchart/flux-system-poc-app --for=condition=Ready --timeout=5m
          VERIFIED=$(kubectl -n flux-system get helmchart flux-system-poc-app \
            -o jsonpath='{.status.conditions[?(@.type=="SourceVerified")].status}')
          echo "SourceVerified=$VERIFIED"; test "$VERIFIED" = "True"
          kubectl -n flux-system wait helmrelease/poc-app --for=condition=Ready --timeout=5m
          kubectl -n poc rollout status deployment/poc-app --timeout=3m
          echo "OK: Flux verified the chart signature and deployed it"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n poc get events --sort-by=.lastTimestamp || true
          kubectl -n cosign-system logs -l app.kubernetes.io/name=policy-controller --tail=200 || true
          flux get all -A || true
          flux events -A || true
